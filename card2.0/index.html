
    <!DOCTYPE html>
<html>
<head>
<title>Rocktrail Visiting Card</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  font-family: 'Poppins', sans-serif;
}

/* Card Container */
.card {
  width: 350px;
  height: 200px;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
  color: white;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* Background Image + Gradient */
.card::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(128,0,128,0.6)),
    url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');
  background-size: cover;
  background-position: center;
  z-index: 0;
}

/* Content */
.content {
  position: relative;
  z-index: 1;
  padding: 20px;
}

/* Company Name */
.company {
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 1px;
}

/* Tagline */
.tagline {
  font-size: 12px;
  margin-top: 5px;
  color: #ddd;
}

/* Name */
.name {
  margin-top: 20px;
  font-size: 18px;
  font-weight: 600;
}

/* Contact */
.contact {
  font-size: 12px;
  margin-top: 5px;
}
</style>

</head>

<body>

<div class="card">
  <div class="content">
    
    <div class="company">ROCKTRAIL ENTERPRISES</div>
    <div class="tagline">Explore Beyond Limits</div>

    <div class="name">Sagar Bali</div>

    <div class="contact">📞 +91 9815155257 || 9899818839</div>
    <div class="contact" style="text-decoration: underline;"> ✉ &nbsp; rocktrailenterprisesemail.com</div>
    <div class="contact">📍 B/458, S.T.No.11,Nehru Nagar Near Patel Nagar, New  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Delhi-110008</div>

  </div>
</div>

</body>
</html>
