<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <h2 class="test-center mb-3"> student result calcualtor</h2>
                        <p class="text center test-muted"
                        > Enetr Number of subject and calcualtor your result</p>
                        <div class="mb-3">
                            <label  class="form-label">Number of subject</label>
                            <input type="number" id="numsubject"
                            class="form-control"
                            placeholder="Enter number of subject"
                            min="1"
                            max="20">
                            <div class="d-grid">
                                <button class="btn btn-primary" one click ="calcualtorResult()"></button>
                            </div>
                            <div id="resultant" class="mt-4 d-done"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    
    <script src="E4 app.js"></script>
</body>
</html>
